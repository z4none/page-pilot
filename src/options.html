<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Page Pilot 设置</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="options">
      <h1>Page Pilot 设置</h1>

      <label class="setting-row">
        <span>
          <strong>跳过确认步骤</strong>
          <small>打开后，右键总结会直接发送到所选 AI 网页。</small>
        </span>
        <input id="skip-confirmation" type="checkbox">
      </label>

      <label class="setting-column">
        <span>
          <strong>AI 网页</strong>
          <small>Kimi 为稳定主线，DeepSeek 作为实验选项。</small>
        </span>
        <select id="provider">
          <option value="kimi">Kimi</option>
          <option value="deepseek">DeepSeek</option>
        </select>
      </label>

      <label class="setting-column">
        <span>
          <strong>最大 Prompt 长度</strong>
          <small>超过后会自动截断，默认 12000 字符。</small>
        </span>
        <input id="max-prompt-length" type="number" min="1000" max="50000" step="1000">
      </label>

      <label class="setting-column">
        <span>
          <strong>默认提示词</strong>
          <small>页面正文会作为附件上传，这里只写总结任务要求。</small>
        </span>
        <textarea id="summary-prompt" class="settings-prompt-editor" spellcheck="false"></textarea>
      </label>

      <div class="actions">
        <button id="reset-prompt" class="secondary-button">恢复默认提示词</button>
        <button id="reset-session" class="secondary-button">重置当前会话</button>
        <button id="save" class="primary-button">保存设置</button>
      </div>

      <p id="status" class="options-status"></p>
    </main>
    <script src="options.js"></script>
  </body>
</html>

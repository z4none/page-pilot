<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Page Pilot Settings</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="options">
      <h1>Page Pilot Settings</h1>

      <label class="setting-row">
        <span>
          <strong>Skip confirmation</strong>
          <small>When enabled, page summaries are sent directly to the selected AI page.</small>
        </span>
        <input id="skip-confirmation" type="checkbox">
      </label>

      <label class="setting-column">
        <span>
          <strong>AI provider</strong>
          <small>Kimi is the primary path; DeepSeek and Gemini are experimental.</small>
        </span>
        <select id="provider">
          <option value="kimi">Kimi</option>
          <option value="deepseek">DeepSeek</option>
          <option value="gemini">Gemini</option>
        </select>
      </label>

      <label class="setting-column">
        <span>
          <strong>Maximum prompt length</strong>
          <small>Longer prompts are truncated automatically. Default: 12000 characters.</small>
        </span>
        <input id="max-prompt-length" type="number" min="1000" max="50000" step="1000">
      </label>

      <label class="setting-column">
        <span>
          <strong>Default prompt</strong>
          <small>Page content is attached as a file; write only the summary task here.</small>
        </span>
        <textarea id="summary-prompt" class="settings-prompt-editor" spellcheck="false"></textarea>
      </label>

      <div class="actions">
        <button id="reset-prompt" class="secondary-button">Restore default</button>
        <button id="reset-session" class="secondary-button">Reset current session</button>
        <button id="save" class="primary-button">Save settings</button>
      </div>

      <p id="status" class="options-status"></p>
    </main>
    <script src="options.js"></script>
  </body>
</html>

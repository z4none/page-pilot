<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Page Pilot</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="panel">
      <header class="header">
        <div>
          <h1>Page Pilot</h1>
          <p id="status">等待页面内容</p>
        </div>
        <div class="toolbar-actions">
          <button id="content-button" class="icon-button" title="查看提取内容" aria-label="查看提取内容" aria-controls="content-modal" disabled>▤</button>
          <button id="settings-button" class="icon-button" title="打开设置" aria-label="打开设置">⚙</button>
          <button id="reset-session-button" class="icon-button" title="重置会话" aria-label="重置会话">↻</button>
        </div>
      </header>

      <section id="kimi-panel" class="panel-section kimi-panel">
        <iframe id="deepseek-frame" title="AI 网页" src="about:blank" frameborder="0"></iframe>
      </section>

      <div id="content-modal" class="modal-overlay hidden" role="dialog" aria-modal="true" aria-labelledby="content-title">
        <section class="content-modal">
          <header class="modal-header">
            <div>
              <h2 id="content-title">提取内容</h2>
              <p id="content-meta" class="content-meta"></p>
            </div>
            <button id="content-cancel-icon" class="icon-button" title="关闭内容" aria-label="关闭内容">×</button>
          </header>
          <pre id="content-viewer" class="content-viewer"></pre>
        </section>
      </div>

      <div id="settings-modal" class="modal-overlay hidden" role="dialog" aria-modal="true" aria-labelledby="settings-title">
        <section class="settings-modal">
          <header class="modal-header">
            <h2 id="settings-title">设置</h2>
            <button id="settings-cancel-icon" class="icon-button" title="关闭设置" aria-label="关闭设置">×</button>
          </header>

          <label class="setting-column setting-column--compact">
            <span>
              <strong>AI 网页</strong>
              <small>Kimi 为稳定主线，DeepSeek 和 Gemini 作为实验选项。</small>
            </span>
            <select id="modal-provider">
              <option value="kimi">Kimi</option>
              <option value="deepseek">DeepSeek</option>
              <option value="gemini">Gemini</option>
            </select>
          </label>

          <label class="setting-column setting-column--compact">
            <span>
              <strong>最大 Prompt 长度</strong>
              <small>超过后会自动截断，默认 12000 字符。</small>
            </span>
            <input id="modal-max-prompt-length" type="number" min="1000" max="50000" step="1000">
          </label>

          <label class="setting-column setting-column--compact">
            <span>
              <strong>默认提示词</strong>
              <small>页面正文会作为附件上传，这里只写总结任务要求。</small>
            </span>
            <textarea id="modal-summary-prompt" class="settings-prompt-editor" spellcheck="false"></textarea>
          </label>

          <p id="settings-modal-status" class="options-status"></p>

          <footer class="modal-actions">
            <div class="modal-actions__secondary">
              <button id="modal-reset-prompt" class="secondary-button">恢复默认提示词</button>
              <button id="modal-reset-session" class="secondary-button">重置当前会话</button>
            </div>
            <div class="modal-actions__primary">
              <button id="settings-cancel" class="secondary-button">取消</button>
              <button id="settings-save" class="primary-button">保存</button>
            </div>
          </footer>
        </section>
      </div>
    </main>
    <script src="sidepanel.js"></script>
  </body>
</html>

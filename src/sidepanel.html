<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Page Pilot</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="panel">
      <header class="header">
        <div>
          <h1>Page Pilot</h1>
          <p id="status" data-i18n="statusWaiting">Waiting for page content</p>
        </div>
        <div class="toolbar-actions">
          <button id="content-button" class="icon-button" data-i18n-title="viewContent" aria-controls="content-modal" disabled>▤</button>
          <button id="settings-button" class="icon-button" data-i18n-title="openSettings">⚙</button>
          <button id="reset-session-button" class="icon-button" data-i18n-title="resetSession">↻</button>
        </div>
      </header>

      <section id="provider-panel" class="panel-section provider-panel">
        <iframe id="provider-frame" title="AI 网页" src="about:blank" frameborder="0"></iframe>
      </section>

      <div id="content-modal" class="modal-overlay hidden" role="dialog" aria-modal="true" aria-labelledby="content-title">
        <section class="content-modal">
          <header class="modal-header">
            <div>
              <h2 id="content-title" data-i18n="extractedContent">Extracted content</h2>
              <p id="content-meta" class="content-meta"></p>
            </div>
            <button id="content-cancel-icon" class="icon-button" data-i18n-title="close">×</button>
          </header>
          <pre id="content-viewer" class="content-viewer"></pre>
        </section>
      </div>

      <div id="settings-modal" class="modal-overlay hidden" role="dialog" aria-modal="true" aria-labelledby="settings-title">
        <section class="settings-modal">
          <header class="modal-header">
            <h2 id="settings-title" data-i18n="settings">Settings</h2>
            <button id="settings-cancel-icon" class="icon-button" data-i18n-title="close">×</button>
          </header>

          <label class="setting-column setting-column--compact">
            <span>
              <strong data-i18n="provider">AI provider</strong>
              <small data-i18n="providerHelp">Kimi is the primary path; DeepSeek and Gemini are experimental.</small>
            </span>
            <select id="modal-provider">
              <option value="kimi">Kimi</option>
              <option value="deepseek">DeepSeek</option>
              <option value="gemini">Gemini</option>
            </select>
          </label>

          <label class="setting-column setting-column--compact">
            <span>
              <strong data-i18n="maxPrompt">Maximum prompt length</strong>
              <small data-i18n="maxPromptHelp">Longer prompts are truncated automatically. Default: 12000 characters.</small>
            </span>
            <input id="modal-max-prompt-length" type="number" min="1000" max="50000" step="1000">
          </label>

          <label class="setting-column setting-column--compact">
            <span>
              <strong data-i18n="defaultPrompt">Default prompt</strong>
              <small data-i18n="defaultPromptHelp">Page content is attached as a file; write only the summary task here.</small>
            </span>
            <textarea id="modal-summary-prompt" class="settings-prompt-editor" spellcheck="false"></textarea>
          </label>

          <p id="settings-modal-status" class="options-status"></p>

          <footer class="modal-actions">
            <div class="modal-actions__secondary">
              <button id="modal-reset-prompt" class="secondary-button" data-i18n="restoreDefault">Restore default</button>
              <button id="modal-reset-session" class="secondary-button" data-i18n="resetCurrentSession">Reset current session</button>
            </div>
            <div class="modal-actions__primary">
              <button id="settings-cancel" class="secondary-button" data-i18n="cancel">Cancel</button>
              <button id="settings-save" class="primary-button" data-i18n="save">Save</button>
            </div>
          </footer>
        </section>
      </div>
    </main>
    <script src="sidepanel.js"></script>
  </body>
</html>

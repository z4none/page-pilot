<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Page Pilot</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="panel">
      <header class="header">
        <div>
          <h1>Page Pilot</h1>
          <p id="status">等待页面内容</p>
        </div>
        <div class="toolbar-actions">
          <button id="settings-button" class="icon-button" title="打开设置" aria-label="打开设置">⚙</button>
          <button id="reset-session-button" class="icon-button" title="重置会话" aria-label="重置会话">↻</button>
        </div>
      </header>

      <section id="loading-panel" class="panel-section hidden">
        <div class="loading-state">
          <div class="spinner" aria-hidden="true"></div>
          <div class="loading-copy">
            <strong id="loading-title">正在提取页面内容...</strong>
            <p id="loading-detail">Kimi 会在后台准备。</p>
          </div>
        </div>
      </section>

      <section id="review-panel" class="panel-section review-panel hidden">
        <section class="block">
          <div class="block-title">提炼结果</div>
          <pre id="markdown-preview" class="preview">右键页面并选择“总结页面”。</pre>
        </section>

        <section class="block">
          <div class="block-title">附件内容</div>
          <div id="attachment-meta" class="attachment-meta">尚未生成附件</div>
          <pre id="attachment-preview" class="preview preview--compact">页面正文会作为附件发送给 Kimi。</pre>
        </section>

        <section class="block">
          <label class="block-title" for="prompt-editor">待发送 Prompt</label>
          <textarea id="prompt-editor" class="prompt-editor" spellcheck="false"></textarea>
        </section>

        <footer class="actions">
          <button id="send-button" class="primary-button" disabled>总结</button>
        </footer>
      </section>

      <section id="kimi-panel" class="panel-section kimi-panel hidden">
        <iframe id="deepseek-frame" title="Kimi" src="https://www.kimi.com/" frameborder="0"></iframe>
      </section>

      <div id="settings-modal" class="modal-overlay hidden" role="dialog" aria-modal="true" aria-labelledby="settings-title">
        <section class="settings-modal">
          <header class="modal-header">
            <h2 id="settings-title">设置</h2>
            <button id="settings-cancel-icon" class="icon-button" title="关闭设置" aria-label="关闭设置">×</button>
          </header>

          <label class="setting-row setting-row--compact">
            <span>
              <strong>跳过确认步骤</strong>
              <small>打开后，右键总结会直接发送到 Kimi。</small>
            </span>
            <input id="modal-skip-confirmation" type="checkbox">
          </label>

          <label class="setting-column setting-column--compact">
            <span>
              <strong>最大 Prompt 长度</strong>
              <small>超过后会自动截断，默认 12000 字符。</small>
            </span>
            <input id="modal-max-prompt-length" type="number" min="1000" max="50000" step="1000">
          </label>

          <p id="settings-modal-status" class="options-status"></p>

          <footer class="modal-actions">
            <button id="modal-reset-session" class="secondary-button">重置 Kimi 会话</button>
            <div class="modal-actions__primary">
              <button id="settings-cancel" class="secondary-button">取消</button>
              <button id="settings-save" class="primary-button">保存</button>
            </div>
          </footer>
        </section>
      </div>
    </main>
    <script src="sidepanel.js"></script>
  </body>
</html>
